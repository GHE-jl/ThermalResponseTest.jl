name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test - Julia ${{ matrix.version }} - ${{ github.event_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11']
    steps:
      - uses: actions/checkout@v7
        with:
          path: ThermalResponseTest.jl
      - uses: actions/checkout@v7
        with:
          repository: GHE-jl/BoreholeResistance.jl
          path: BoreholeResistance.jl
          token: ${{ secrets.GHEJL_CHECKOUT_TOKEN || github.token }}
      - uses: actions/checkout@v7
        with:
          repository: GHE-jl/GroundResponse.jl
          path: GroundResponse.jl
          token: ${{ secrets.GHEJL_CHECKOUT_TOKEN || github.token }}
      - uses: actions/checkout@v7
        with:
          repository: GHE-jl/GroundHeatExchanger.jl
          path: GroundHeatExchanger.jl
          token: ${{ secrets.GHEJL_CHECKOUT_TOKEN || github.token }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Run tests
        run: julia --project=ThermalResponseTest.jl -e '
          using Pkg; Pkg.test()'
        working-directory: ${{ github.workspace }}
